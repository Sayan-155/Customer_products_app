<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Moto Compare{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">🏍️ Moto<span>Compare</span></a>
    <nav>
      <a href="{{ url_for('index') }}">Browse</a>
      <a href="{{ url_for('compare_page') }}">Compare <span id="compare-count-badge" class="badge" style="display:none;">0</span></a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>Local demo app &middot; runs entirely on your machine &middot; not deployed anywhere</p>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
